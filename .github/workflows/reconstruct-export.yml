name: Reconstruct Base44 export

on:
  push:
    branches: ["github-native-migration"]
    paths:
      - "68d2c3d10887bbe5530210d6 (2).zip"
      - "scripts/reconstruct_export.py"
      - ".github/workflows/reconstruct-export.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github-native-migration
      - name: Unpack original Base44 export
        run: |
          rm -rf raw-export
          mkdir raw-export
          unzip -q "68d2c3d10887bbe5530210d6 (2).zip" -d raw-export
      - name: Restore project structure
        run: python scripts/reconstruct_export.py
      - name: Commit restored project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete Tech Helper source from Base44 export" || exit 0
          git push origin HEAD:github-native-migration
